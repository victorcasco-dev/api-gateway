spring:
  application:
    name: api-gateway
  cloud:
    discovery:
      enabled: true
    loadbalancer:
      cache:
        ttl: 3s
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-users-auth
              uri: ${GATEWAY_MS_USERS_URI:lb://ms-users}
              predicates:
                - Path=/auth/**

            - id: ms-users
              uri: ${GATEWAY_MS_USERS_URI:lb://ms-users}
              predicates:
                - Path=/users/**,/professors/**,/research-lines/**,/catalogs/**,/professor-research-lines/**

            - id: ms-availability
              uri: ${GATEWAY_MS_AVAILABILITY_URI:lb://ms-availability}
              predicates:
                - Path=/time-slots/**,/professor-references/**

            - id: ms-reservas
              uri: ${GATEWAY_MS_RESERVAS_URI:lb://ms-reservas}
              predicates:
                - Path=/reservations/**,/consultation-types/**

            - id: ms-notificaciones
              uri: ${GATEWAY_MS_NOTIFICACIONES_URI:lb://ms-notificaciones}
              predicates:
                - Path=/notifications/**,/email-templates/**,/contact/**

            - id: ms-users-openapi
              uri: ${GATEWAY_MS_USERS_URI:lb://ms-users}
              predicates:
                - Path=/v3/api-docs/ms-users
              filters:
                - RewritePath=/v3/api-docs/ms-users, /v3/api-docs

            - id: ms-availability-openapi
              uri: ${GATEWAY_MS_AVAILABILITY_URI:lb://ms-availability}
              predicates:
                - Path=/v3/api-docs/ms-availability
              filters:
                - RewritePath=/v3/api-docs/ms-availability, /v3/api-docs

            - id: ms-reservas-openapi
              uri: ${GATEWAY_MS_RESERVAS_URI:lb://ms-reservas}
              predicates:
                - Path=/v3/api-docs/ms-reservas
              filters:
                - RewritePath=/v3/api-docs/ms-reservas, /v3/api-docs

            - id: ms-notificaciones-openapi
              uri: ${GATEWAY_MS_NOTIFICACIONES_URI:lb://ms-notificaciones}
              predicates:
                - Path=/v3/api-docs/ms-notificaciones
              filters:
                - RewritePath=/v3/api-docs/ms-notificaciones, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Sin esto Swagger UI solo muestra el OpenAPI vacío del gateway (un solo "server").
    disable-swagger-default-url: true
    urls-primary-name: ms-users
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: ms-users
        url: /v3/api-docs/ms-users
      - name: ms-availability
        url: /v3/api-docs/ms-availability
      - name: ms-reservas
        url: /v3/api-docs/ms-reservas
      - name: ms-notificaciones
        url: /v3/api-docs/ms-notificaciones

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: WARN
    com.reservas.security: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-change-this-secret-key}
      expiration: ${JWT_EXPIRATION:1h}
      clock-skew: ${JWT_CLOCK_SKEW:30s}
      issuer: ${JWT_ISSUER:reservas-ms-users}
      token-type: ${JWT_TOKEN_TYPE:Bearer}
    public-paths:
      - /auth/login
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**
      - /actuator/health
      - /actuator/info
    rules:
      - path: /professors/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /research-lines/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /professor-research-lines/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /time-slots/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /professor-references/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /time-slots/*/book
        methods: [PUT]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /time-slots/*/release
        methods: [PUT]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /professors/**
        methods: [POST, PUT, DELETE]
        roles: [PROFESSOR, ADMINISTRATOR]
      - path: /research-lines/**
        methods: [POST, PUT, DELETE]
        roles: [ADMINISTRATOR]
      - path: /professor-research-lines/**
        methods: [PUT, DELETE]
        roles: [PROFESSOR, ADMINISTRATOR]
      - path: /time-slots/**
        methods: [POST, PUT, DELETE]
        roles: [PROFESSOR, ADMINISTRATOR]
      - path: /users/**
        methods: [GET, POST, PUT, DELETE]
        roles: [ADMINISTRATOR]

